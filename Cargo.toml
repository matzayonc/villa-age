[package]
name = "villa-age"
version = "0.1.0"
edition = "2024"

[dependencies]
# Default features already include 2d, 3d, mouse/keyboard input and x11.
bevy = { version = "0.19", features = ["wayland"] }

# Faster dev iteration: optimize dependencies (Bevy) fully, our own code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
